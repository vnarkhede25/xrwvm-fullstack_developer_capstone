<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us - Dealership Reviews</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: Arial, sans-serif;
        }
        .contact-container {
            max-width: 850px;
            margin: 45px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }
        .contact-container img {
            width: 260px;
            max-width: 100%;
            border-radius: 8px;
        }
        .contact-info {
            flex: 1;
            min-width: 230px;
        }
        .contact-info h1 {
            color: #087e8b;
            margin-bottom: 20px;
        }
        .contact-info p {
            font-size: 17px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise;">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Dealerships</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="/contact">Contact Us</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="contact-container">
    <img src="/static/contactus.png" alt="Contact our team">
    <div class="contact-info">
        <h1>Contact Us</h1>
        <p>Have questions or need assistance? We are here to help.</p>
        <p><strong>Email:</strong> support@dealershipreviews.com</p>
        <p><strong>Phone:</strong> +1 800 555 0199</p>
        <p><strong>Address:</strong> 123 Main Street, Chicago, IL, USA</p>
        <p><strong>Working Hours:</strong> Monday – Friday, 9:00 AM – 5:00 PM</p>
    </div>
</div>
</body>
</html>
